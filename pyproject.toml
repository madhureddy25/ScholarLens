[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarlens"
version = "0.1.0"
description = "Integrity-first toolkit for academic text: paraphrase-robust AI-text detection and citation-safe editing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pylatexenc>=2.10",
  "python-docx>=1.1",
  "lxml>=4.9",
  "pydantic>=2.5",
  "typer>=0.9",
  "rich>=13",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "transformers>=4.40", "sentence-transformers>=2.6", "scikit-learn>=1.3", "networkx>=3"]
nlp = ["spacy>=3.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
anthropic = ["anthropic>=2.8"]
openai = ["openai>=1.40"]
bench = ["datasets>=2.18"]
rl = ["trl>=1.0", "peft>=0.15", "datasets>=2.18", "accelerate>=0.30"]
all = ["scholarlens[ml,api,anthropic,openai,bench,rl]"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
scholarlens = "scholarlens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model downloads (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
